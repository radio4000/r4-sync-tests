<!doctype html>
<!-- biome-ignore lint/a11y/useValidLang: SvelteKit replaces %lang% at runtime -->
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		<link rel="manifest" href="%sveltekit.assets%/webmanifest.json" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Radio+Canada:ital,wdth,wght@0,75..100,300..700;1,75..100,300..700&family=Recursive:wght@300..1000&family=Rosario:ital,wght@0,300..700;1,300..700&display=swap"
			rel="stylesheet"
		/>

		<meta name="theme-color" content="lch(97.5% 0 282)" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="lch(7% 1.867 272)" media="(prefers-color-scheme: dark)" />
		<!-- <script src="'https://www.youtube.com/iframe_api'"></script> -->

		<!-- Title and description come from the Seo component. Hardcoding them here
		     too would emit a second, always-wrong one on server-rendered pages. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
